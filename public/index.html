<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Campus Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Campus Library</h1>
        <p class="sub">Authors and their books — data served by GraphQL</p>

        <div id="list" class="message">Loading...</div>

        <form id="addForm">
            <h3>Add a book</h3>
            <input id="title" placeholder="Book title" required>
            <input id="year" type="number" placeholder="Year" style="width: 90px">
            <select id="authorId">
                <option value="1">Asha Patel</option>
                <option value="2">Ravi Kumar</option>
            </select>
            <button type="submit">Add book</button>
        </form>
    </main>

    <script>
        const API = 'http://localhost:4000/';

        async function gql(query, variables = {}) {
            const response = await fetch(API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, variables })
            });

            const json = await response.json();

            if (json.errors) {
                throw new Error(json.errors[0].message);
            }

            return json.data;
        }

        async function load() {
            const list = document.getElementById('list');

            try {
                const data = await gql(`
                    query {
                        authors {
                            id
                            name
                            country
                            books {
                                title
                                year
                            }
                        }
                    }
                `);

                list.innerHTML = data.authors.map(author => `
                    <div class="author-card">
                        <h2>${author.name}</h2>
                        <div class="country">${author.country || ''}</div>
                        ${author.books.length
                            ? author.books.map(book => `
                                <div class="book">
                                    ${book.title}
                                    <span class="yr">(${book.year ?? 'N/A'})</span>
                                </div>
                            `).join('')
                            : '<div class="book">No books yet</div>'
                        }
                    </div>
                `).join('');
            } catch (error) {
                list.textContent = `Could not load data: ${error.message}`;
            }
        }

        document.getElementById('addForm').addEventListener('submit', async (event) => {
            event.preventDefault();

            const title = document.getElementById('title').value.trim();
            const yearValue = document.getElementById('year').value;
            const year = yearValue ? Number(yearValue) : null;
            const authorId = document.getElementById('authorId').value;

            try {
                await gql(
                    `mutation($title:String!, $year:Int, $authorId:ID!) {
                        addBook(title:$title, year:$year, authorId:$authorId) {
                            id
                        }
                    }`,
                    { title, year, authorId }
                );

                event.target.reset();
                await load();
            } catch (error) {
                alert(`Could not add the book: ${error.message}`);
            }
        });

        load();
    </script>
</body>
</html>
